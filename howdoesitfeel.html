<!-- The Form -->
<form id="my-form"   action="https://formspree.io/f/xzedldyr" method="POST">
  <label for="name">Your Name:</label>
  <input type="text" id="name" name="name" required> <br>

  <label for="email">Your Email:</label>
  <input type="email" id="_replyto" name="email" required> <br>


  <label for="message">Your Message:</label>
  <textarea id="message" name="message" rows="5" required></textarea> <br>


  <button type="submit" id="submit-btn">Send Message</button>
</form>

<!-- The Status Message Containers -->
<p id="form-status" style="display:none; font-weight: bold; margin-top: 15px;"></p>

<script>
  const form = document.getElementById("my-form");
  const status = document.getElementById("form-status");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async function(event) {
    // 1. Stop the browser from redirecting to Formspree
    event.preventDefault(); 
    
    // 2. Prepare the form data to be sent
    const data = new FormData(event.target);
    
    // 3. Disable button and update UI text while loading
    submitBtn.disabled = true;
    submitBtn.innerText = "Sending...";

    // 4. Send the request to Formspree via Javascript Fetch API
    fetch(event.target.action, {
      method: form.method,
      body: data,
      headers: {
        'Accept': 'application/json' // Tells Formspree to return JSON instead of a webpage redirect
      }
    }).then(response => {
      status.style.display = "block";
      if (response.ok) {
        // 5. Success! Show a clean message and hide the form
        status.innerHTML = "✨ Thanks for your message! I'll get back to you soon.";
        status.style.color = "green";
        form.style.display = "none"; 
      } else {
        // 6. Error handling (e.g., rate limits or Formspree issues)
        response.json().then(data => {
          if (Object.hasOwn(data, 'errors')) {
            status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
          } else {
            status.innerHTML = "❌ Oops! There was a problem submitting your form.";
          }
        });
        status.style.color = "red";
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Message";
      }
    }).catch(error => {
      status.style.display = "block";
      status.innerHTML = "❌ Oops! There was a network problem submitting your form.";
      status.style.color = "red";
      submitBtn.disabled = false;
      submitBtn.innerText = "Send Message";
    });
  });
</script>
